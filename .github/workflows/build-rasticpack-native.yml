name: Build Rasticpack Native APK

on:
  push:
    branches: [ android-apk ]
    paths:
      - 'rasticpack-native/**'
      - '.github/workflows/build-rasticpack-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rasticpack-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rasticpack-native-apk
          path: rasticpack-native/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK into the branch
        working-directory: .
        run: |
          mkdir -p rasticpack-native/dist
          cp rasticpack-native/android/app/build/outputs/apk/debug/app-debug.apk rasticpack-native/dist/rasticpack-native-debug.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f rasticpack-native/dist/rasticpack-native-debug.apk
          git commit -m "Add built APK [skip ci]" || echo "nothing to commit"
          git push origin HEAD:android-apk
