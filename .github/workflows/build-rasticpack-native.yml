name: Build Rasticpack Native APK

on:
  push:
    branches: [ android-apk ]
    paths:
      - 'rasticpack-native/**'
      - '.github/workflows/build-rasticpack-native.yml'
  workflow_dispatch:
    inputs:
      install_password:
        description: 'Install password (only if no secret is set)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rasticpack-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Encrypt app code (install password)
        env:
          INSTALL_PASSWORD: ${{ secrets.INSTALL_PASSWORD || secrets.ADONIS || inputs.install_password }}
        run: node encrypt-web.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Apply Rastic name and icon
        run: python3 apply_branding.py

      - name: Install home-screen widget (native Android code)
        run: python3 install_widget.py

      - name: Install card-number widget (native Android code)
        run: python3 install_cardwidget.py

      - name: Install SMS receive/send plugin
        run: python3 install_sms.py

      - name: Install fingerprint plugin
        run: python3 install_bio.py

      - name: Fetch offline Persian speech model
        run: python3 fetch_voice_model.py

      - name: Voice smoke test (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get install -y espeak-ng ffmpeg >/dev/null 2>&1 || true
          pip install vosk >/dev/null 2>&1 || true
          python3 voice_sanity.py

      - name: Install voice plugin
        run: python3 install_voice.py

      - name: Keep screen on
        run: python3 keep_awake.py

      - name: Auto-open keyboard on launch
        run: python3 keyboard_open.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rasticpack-native-apk
          path: rasticpack-native/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK into the branch
        working-directory: .
        run: |
          mkdir -p rasticpack-native/dist
          cp rasticpack-native/android/app/build/outputs/apk/debug/app-debug.apk rasticpack-native/dist/rasticpack-native-debug.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f rasticpack-native/dist/rasticpack-native-debug.apk
          git commit -m "Add built APK [skip ci]" || echo "nothing to commit"
          git push origin HEAD:android-apk
