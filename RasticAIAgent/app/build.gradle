plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rastic.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.rastic.agent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // نسخه اول هیچ کتابخانه‌ی خارجی لازم ندارد؛ فقط Android SDK.
    // اگر در آینده به AppCompat/Material نیاز شد اینجا اضافه می‌شود.
}
